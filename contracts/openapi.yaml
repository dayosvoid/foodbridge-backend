openapi: 3.0.3

info:
  title: FoodBridge API
  description: API for coordinating surplus food listings between donors and recipients.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://foodbridge-backend-rg9f.onrender.com
    description: Production server on Render

paths:
  /api/auth/login:
    post:
      operationId: login
      summary: Authenticate a user using email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing or invalid login fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials

  /api/auth/me:
    get:
      operationId: getCurrentUser
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Authentication required

  /api/listings/images:
    post:
      operationId: uploadListingImage
      summary: Upload a listing image to Cloudinary
      description: Upload an image and return its hosted URL for use when creating a listing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - imageUrl
                properties:
                  imageUrl:
                    type: string
                    format: uri
        '400':
          description: Invalid or empty image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
        '500':
          description: Image upload failed

  /api/listings:
    get:
      operationId: browseListings
      summary: Browse food listings
      security: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: pickupArea
          in: query
          required: false
          schema:
            type: string
        - name: availability
          in: query
          required: false
          schema:
            type: string
            enum:
              - AVAILABLE
              - RESERVED
              - COLLECTED
              - REVERSED
              - EXPIRED
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: mine
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Listings returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingResponse'
        '400':
          description: Invalid listing query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required when mine=true
        '403':
          description: Donor or admin required when mine=true

    post:
      operationId: createListing
      summary: Create a food listing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '400':
          description: Invalid listing data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
        '403':
          description: Donor role required

  /api/listings/{listingId}:
    get:
      operationId: getListing
      summary: Get a food listing
      security: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Listing returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '404':
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/listings/{listingId}/requests:
    get:
      operationId: getListingRequests
      summary: Get requests for a listing
      security:
        - bearerAuth: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Requests returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodRequest'
        '401':
          description: Authentication required
        '403':
          description: Donor owner or admin required
        '404':
          description: Listing not found

    post:
      operationId: requestFoodListing
      summary: Request a food listing
      security:
        - bearerAuth: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodRequest'
        '400':
          description: Invalid request or missing required header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
        '403':
          description: Recipient role required
        '404':
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Listing unavailable or idempotency key reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/requests:
    get:
      operationId: getMyRequests
      summary: Get the authenticated recipient's requests
      security:
        - bearerAuth: []
      parameters:
        - name: mine
          in: query
          required: true
          schema:
            type: boolean
            enum:
              - true
      responses:
        '200':
          description: Requests returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodRequest'
        '400':
          description: The mine parameter must be true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
        '403':
          description: Recipient role required

  /api/requests/{requestId}:
    get:
      operationId: getFoodRequest
      summary: Get a food request
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodRequest'
        '401':
          description: Authentication required
        '403':
          description: Request owner, listing donor, or admin required
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/requests/{requestId}/approve:
    patch:
      operationId: approveFoodRequest
      summary: Approve a food request
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodRequest'
        '401':
          description: Authentication required
        '403':
          description: Donor owner or admin required
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Already reserved or request not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/requests/{requestId}/decline:
    patch:
      operationId: declineFoodRequest
      summary: Decline a food request
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodRequest'
        '401':
          description: Authentication required
        '403':
          description: Donor owner or admin required
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Request not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/requests/{requestId}/cancel:
    post:
      operationId: cancelFoodRequest
      summary: Cancel own pending food request
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodRequest'
        '401':
          description: Authentication required
        '403':
          description: Recipient owner required
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Request not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    CreateListingRequest:
      type: object
      required:
        - foodName
        - description
        - category
        - quantity
        - unit
        - pickupArea
        - collectionDeadline
      properties:
        foodName:
          type: string
        description:
          type: string
        category:
          type: string
          enum:
            - PREPARED_MEALS
            - PRODUCE
            - BAKERY
            - DAIRY
            - PANTRY
            - OTHER
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
          enum:
            - PORTIONS
            - KG
            - LITRES
            - ITEMS
            - BOXES
        imageReference:
          type: string
          nullable: true
        pickupArea:
          type: string
        collectionDeadline:
          type: string
          format: date-time

    ListingResponse:
      type: object
      required:
        - id
        - foodName
        - description
        - category
        - quantity
        - unit
        - pickupArea
        - collectionDeadline
        - status
        - donorId
        - donorName
        - createdAt
        - pendingRequestCount
      properties:
        id:
          type: string
          format: uuid
        foodName:
          type: string
        description:
          type: string
        category:
          type: string
        quantity:
          type: number
        unit:
          type: string
        imageReference:
          type: string
          nullable: true
        pickupArea:
          type: string
        collectionDeadline:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - AVAILABLE
            - RESERVED
            - COLLECTED
            - REVERSED
            - EXPIRED
        donorId:
          type: string
          format: uuid
        donorName:
          type: string
        createdAt:
          type: string
          format: date-time
        pendingRequestCount:
          type: integer
          minimum: 0

    FoodRequest:
      type: object
      required:
        - id
        - listingId
        - recipientId
        - recipientName
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        listingId:
          type: string
          format: uuid
        recipientId:
          type: string
          format: uuid
        recipientName:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - APPROVED
            - DECLINED
            - CANCELLED
            - EXPIRED
        createdAt:
          type: string
          format: date-time

    LoginResponse:
      type: object
      required:
        - token
        - id
        - name
        - role
        - organisationName
        - email
      properties:
        token:
          type: string
          description: Opaque Bearer token used to authenticate subsequent requests.
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
            - DONOR
            - RECIPIENT
            - ADMIN
        organisationName:
          type: string
        email:
          type: string
          format: email

    MeResponse:
      type: object
      required:
        - id
        - name
        - role
        - organisationName
        - email
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
            - DONOR
            - RECIPIENT
            - ADMIN
        organisationName:
          type: string
        email:
          type: string
          format: email

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time