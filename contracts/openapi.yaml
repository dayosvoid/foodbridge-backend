openapi: 3.0.3

info:
  title: FoodBridge API
  description: API for coordinating surplus food listings between donors and recipients.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:

  /api/auth/login:
    post:
      summary: Authenticate a user
      description: Authenticates a user using username and password and returns a Basic Authentication token together with the user's profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /api/auth/me:
    get:
      summary: Get current user profile
      security:
        - basicAuth: []
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Authentication required

  /api/listings:
    get:
      summary: Browse food listings
      description: Returns food listings with optional filtering by category, pickup area, availability and keyword.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string

        - name: pickupArea
          in: query
          required: false
          schema:
            type: string

        - name: availability
          in: query
          required: false
          schema:
            type: string
            enum:
              - AVAILABLE
              - EXPIRED

        - name: keyword
          in: query
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Listings returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingResponse'

    post:
      summary: Create a food listing
      description: Creates a new surplus food listing.
      security:
        - basicAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'

      responses:
        '201':
          description: Listing created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'

        '400':
          description: Invalid listing data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Authentication required

  /api/listings/{listingId}:
    get:
      summary: Get a food listing
      description: Returns a single food listing by its ID.
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Listing returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'

        '404':
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required:
        - token
        - id
        - name
        - role
        - organisationName
      properties:
        token:
          type: string
        id:
          type: string
        name:
          type: string
        role:
          type: string
        organisationName:
          type: string

    MeResponse:
      type: object
      required:
        - id
        - name
        - role
        - organisationName
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        organisationName:
          type: string

    CreateListingRequest:
      type: object
      required:
        - title
        - category
        - quantity
        - pickupArea
        - collectionDeadline
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit:
          type: string
        imageReference:
          type: string
          nullable: true
        pickupArea:
          type: string
        collectionDeadline:
          type: string
          format: date-time

    ListingResponse:
      type: object
      required:
        - id
        - title
        - category
        - quantity
        - pickupArea
        - collectionDeadline
        - state
        - donorId
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        quantity:
          type: integer
        unit:
          type: string
        imageReference:
          type: string
          nullable: true
        pickupArea:
          type: string
        collectionDeadline:
          type: string
          format: date-time
        state:
          type: string
          enum:
            - AVAILABLE
            - RESERVED
            - EXPIRED
            - COMPLETED
        donorId:
          type: string

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time