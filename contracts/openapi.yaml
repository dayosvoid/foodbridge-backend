openapi: 3.0.3

info:
  title: FoodBridge API
  description: API for coordinating surplus food listings between donors and recipients.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

  - url: https://YOUR-FOODBRIDGE-RENDER-URL.onrender.com
    description: Render deployment

paths:

  /api/auth/login:
    post:
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /api/auth/me:
    get:
      summary: Get current user profile
      security:
        - basicAuth: []
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Authentication required

  /api/listings:
    get:
      summary: Browse food listings
      parameters:
        - name: category
          in: query
          schema:
            type: string

        - name: pickupArea
          in: query
          schema:
            type: string

        - name: availability
          in: query
          schema:
            type: string
            enum:
              - AVAILABLE
              - RESERVED
              - COLLECTED
              - REVERSED
              - EXPIRED

        - name: keyword
          in: query
          schema:
            type: string

        - name: mine
          in: query
          schema:
            type: boolean
            default: false

        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0

        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50

      responses:
        '200':
          description: Listings returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingResponse'

        '401':
          description: Authentication required when mine=true

        '403':
          description: Donor or admin required when mine=true

    post:
      summary: Create a food listing
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'

        '400':
          description: Invalid listing data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Authentication required

        '403':
          description: Donor role required

  /api/listings/{listingId}:
    get:
      summary: Get a food listing
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Listing returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'

        '404':
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/listings/{listingId}/requests:
    get:
      summary: Get requests for a listing
      security:
        - basicAuth: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Requests returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodRequest'

        '401':
          description: Authentication required

        '403':
          description: Donor owner or admin required

        '404':
          description: Listing not found

    post:
      summary: Request a food listing
      security:
        - basicAuth: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid

        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200

      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodRequest'

        '401':
          description: Authentication required

        '403':
          description: Recipient role required

        '409':
          description: Listing unavailable or idempotency key reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/requests:
    get:
      summary: Get the authenticated recipient's requests
      security:
        - basicAuth: []
      parameters:
        - name: mine
          in: query
          required: true
          schema:
            type: boolean
            enum:
              - true
      responses:
        '200':
          description: Requests returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodRequest'

        '401':
          description: Authentication required

        '403':
          description: Recipient role required

  /api/requests/{requestId}:
    get:
      summary: Get a food request
      security:
        - basicAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodRequest'

        '401':
          description: Authentication required

        '403':
          description: Request owner, listing donor, or admin required

        '404':
          description: Request not found

  /api/requests/{requestId}/approve:
    patch:
      summary: Approve a food request
      security:
        - basicAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodRequest'

        '401':
          description: Authentication required

        '403':
          description: Donor owner or admin required

        '404':
          description: Request not found

        '409':
          description: Already reserved, request not pending, or daily distribution priority restriction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/requests/{requestId}/decline:
    patch:
      summary: Decline a food request
      security:
        - basicAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodRequest'

        '401':
          description: Authentication required

        '403':
          description: Donor owner or admin required

        '404':
          description: Request not found

        '409':
          description: Request not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/requests/{requestId}/cancel:
    post:
      summary: Cancel own pending food request
      security:
        - basicAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodRequest'

        '401':
          description: Authentication required

        '403':
          description: Recipient owner required

        '404':
          description: Request not found

        '409':
          description: Request not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/distribution/today:
    get:
      tags:
        - Administration
      operationId: getTodayDistribution
      summary: Get today's fair-distribution status
      description: Returns daily distribution statistics using Africa/Lagos calendar days.
      security:
        - basicAuth: []
      responses:
        '200':
          description: Daily distribution status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyDistributionSummary'

        '401':
          description: Authentication required

        '403':
          description: Admin role required

components:

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    CreateListingRequest:
      type: object
      required:
        - title
        - description
        - category
        - quantity
        - unit
        - pickupArea
        - collectionDeadline
      properties:
        title:
          type: string

        description:
          type: string

        category:
          type: string
          enum:
            - PREPARED_MEALS
            - PRODUCE
            - BAKERY
            - DAIRY
            - PANTRY
            - OTHER

        quantity:
          type: number
          minimum: 0

        unit:
          type: string
          enum:
            - PORTIONS
            - KG
            - LITRES
            - ITEMS
            - BOXES

        imageReference:
          type: string
          nullable: true

        pickupArea:
          type: string

        collectionDeadline:
          type: string
          format: date-time

    ListingResponse:
      type: object
      required:
        - id
        - title
        - description
        - category
        - quantity
        - unit
        - pickupArea
        - collectionDeadline
        - state
        - donorId
        - donorName
        - createdAt
        - pendingRequestCount
      properties:
        id:
          type: string
          format: uuid

        title:
          type: string

        description:
          type: string

        category:
          type: string

        quantity:
          type: number

        unit:
          type: string

        imageReference:
          type: string
          nullable: true

        pickupArea:
          type: string

        collectionDeadline:
          type: string
          format: date-time

        state:
          type: string
          enum:
            - AVAILABLE
            - RESERVED
            - COLLECTED
            - REVERSED
            - EXPIRED

        donorId:
          type: string
          format: uuid

        donorName:
          type: string

        createdAt:
          type: string
          format: date-time

        pendingRequestCount:
          type: integer
          minimum: 0

    FoodRequest:
      type: object
      required:
        - id
        - listingId
        - requesterId
        - requesterName
        - state
        - createdAt
      properties:
        id:
          type: string
          format: uuid

        listingId:
          type: string
          format: uuid

        requesterId:
          type: string
          format: uuid

        requesterName:
          type: string

        state:
          type: string
          enum:
            - PENDING
            - APPROVED
            - DECLINED
            - CANCELLED
            - EXPIRED

        createdAt:
          type: string
          format: date-time

    LoginResponse:
      type: object
      required:
        - token
        - id
        - name
        - role
        - organisationName
      properties:
        token:
          type: string

        id:
          type: string

        name:
          type: string

        role:
          type: string
          enum:
            - DONOR
            - RECIPIENT
            - ADMIN

        organisationName:
          type: string

    MeResponse:
      type: object
      required:
        - id
        - name
        - role
        - organisationName
      properties:
        id:
          type: string

        name:
          type: string

        role:
          type: string
          enum:
            - DONOR
            - RECIPIENT
            - ADMIN

        organisationName:
          type: string

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string

        message:
          type: string

        timestamp:
          type: string
          format: date-time

    DailyDistributionSummary:
      type: object
      required:
        - totalRecipients
        - availableListings
        - approvedListingsToday
        - recipientsServedToday
        - recipientsWaitingToday
        - firstRoundInProgress
      properties:
        totalRecipients:
          type: integer
          format: int64

        availableListings:
          type: integer
          format: int64

        approvedListingsToday:
          type: integer
          format: int64

        recipientsServedToday:
          type: integer
          format: int64

        recipientsWaitingToday:
          type: integer
          format: int64

        firstRoundInProgress:
          type: boolean