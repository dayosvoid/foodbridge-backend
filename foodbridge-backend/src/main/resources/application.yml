spring:
  application:
    name: foodbridge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foodbridge}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
