spring:
  application:
    name: foodbridge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/foodbridge}
    username: ${DB_USERNAME:foodbridge}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

logging:
  structured:
    format:
      console: ecs
