spring:
  application:
    name: foodbridge
  datasource:
    # Notice I updated the default port to 5433 and credentials based on your second block,
    # while keeping the environment variable fallbacks intact.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/foodbridge}
    username: ${DB_USERNAME:foodbridge}
    password: ${DB_PASSWORD:foodbridge_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}